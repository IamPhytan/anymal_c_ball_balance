[project]
name = "anymal-c-ball-balance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Damien LaRocque", email = "phicoltan@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = ["mjlab>=1.1.0", "anymal-c-velocity", "wandb<0.29"]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.14.14"]

[tool.ruff]
indent-width = 4
src = ["anymal_c_ball_balance"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project.entry-points."mjlab.tasks"]
anymal_c_ball_balance = "anymal_c_ball_balance"

[tool.uv.sources]
anymal-c-velocity = { git = "https://github.com/IamPhytan/anymal_c_velocity.git", branch = "fix/upgrade-mjlab" }

[tool.pyright]
stubPath = "./typings"
